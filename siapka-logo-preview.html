<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<title>SiAPKA Logo — Positive & Negative</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:0;}
.row{display:flex;gap:0;width:100%;}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;gap:32px;}
.panel.light{background:#ffffff;}
.panel.dark{background:#0E1937;}
.label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.45;}
.panel.light .label{color:#0E1937;}
.panel.dark .label{color:#fff;}
.divider{width:1px;background:rgba(0,0,0,0.08);}

/* ─ LOGO ─ */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1;}
.logo-letters{display:flex;align-items:baseline;gap:0px;}
.logo-letters span{font-family:'Nunito',sans-serif;font-weight:900;font-size:80px;line-height:1;}

/* Positive colors */
.panel.light .s1{color:#F7941D;}
.panel.light .a1{color:#1A3D8F;}
.panel.light .p1{color:#E02020;}
.panel.light .k1{color:#F5C518;}
.panel.light .a2{color:#3DAA4E;}

/* Negative colors — all white */
.panel.dark .s1,.panel.dark .a1,.panel.dark .p1,.panel.dark .k1,.panel.dark .a2{color:#ffffff;}

.logo-tagline{font-size:13px;font-weight:700;letter-spacing:0.3px;text-align:center;}
.panel.light .logo-tagline{color:#1A3D8F;}
.panel.dark .logo-tagline{color:rgba(255,255,255,0.65);}

/* Sizes showcase */
.sizes{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:8px;}
.size-row{display:flex;align-items:baseline;gap:0;}
.size-row span{font-family:'Nunito',sans-serif;font-weight:900;}

.panel.light .size-row span.s1{color:#F7941D;}
.panel.light .size-row span.a1{color:#1A3D8F;}
.panel.light .size-row span.p1{color:#E02020;}
.panel.light .size-row span.k1{color:#F5C518;}
.panel.light .size-row span.a2{color:#3DAA4E;}

.panel.dark .size-row span{color:#fff;}
</style>
</head>
<body>

<div class="row">

  <!-- POSITIVE -->
  <div class="panel light">
    <div class="label">Positive</div>
    <!-- Large -->
    <div class="logo">
      <div class="logo-letters">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="logo-tagline">Sistem Informasi Aplikasi Pengujian Perkeretaapian</div>
    </div>

    <!-- Medium -->
    <div class="sizes">
      <div class="size-row" style="font-size:48px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="size-row" style="font-size:28px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="size-row" style="font-size:16px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- NEGATIVE -->
  <div class="panel dark">
    <div class="label">Negative</div>
    <!-- Large -->
    <div class="logo">
      <div class="logo-letters">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="logo-tagline">Sistem Informasi Aplikasi Pengujian Perkeretaapian</div>
    </div>

    <!-- Sizes -->
    <div class="sizes">
      <div class="size-row" style="font-size:48px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="size-row" style="font-size:28px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
      <div class="size-row" style="font-size:16px;">
        <span class="s1">S</span><span class="s1">i</span><span class="a1">A</span><span class="p1">P</span><span class="k1">K</span><span class="a2">A</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
