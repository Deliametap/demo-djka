<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo BLU Pengujian Uji Sarana</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1f2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-box {
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-logo-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">Badan Layanan Umum</span>
      <span class="brand-sub">Pengujian Uji Sarana</span>
    </div>
  </div>
</body>
</html>
